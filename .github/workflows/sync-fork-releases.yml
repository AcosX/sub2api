name: Sync Upstream

# Keeps this fork's main tracking Wei-Shaw/sub2api@main, then publishes fork
# releases tagged v<upstream-base>-acosx.N that carry the fork-only commits
# (pre-merged upstream PRs such as Wei-Shaw/sub2api#8608). The fork's Release
# workflow builds those tags, so installs and in-app updates follow the fork
# while automatically picking up every new upstream release.

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork main (full history)
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main and release tags
        run: |
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main
          git fetch upstream 'refs/tags/v*:refs/tags/v*' --no-tags

      - name: Merge upstream/main into main
        id: merge
        run: |
          set -euo pipefail
          behind=$(git rev-list --count main..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "main is already up to date with upstream/main" >> "$GITHUB_STEP_SUMMARY"
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          if git merge --ff-only upstream/main 2>/dev/null; then
            echo "Fast-forwarded main by $behind commit(s) from upstream/main." >> "$GITHUB_STEP_SUMMARY"
          else
            git merge --no-ff --no-edit upstream/main
            echo "main diverged from upstream: created a merge commit absorbing $behind upstream commit(s)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push main
        if: steps.merge.outputs.up_to_date != 'true'
        run: git push origin main

      # Releasing: when upstream cuts a new vX.Y.Z release that main does not
      # cover yet, tag the fork build as vX.Y.Z-acosx.N (N increments per base).
      # A GITHUB_TOKEN push cannot trigger workflows, so tags go through a
      # read-write deploy key whose push events start the Release workflow.
      - name: Set up deploy key for release tagging
        env:
          DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > $HOME/.ssh/sync_deploy_key
          chmod 600 $HOME/.ssh/sync_deploy_key
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          GIT_SSH_COMMAND='ssh -i $HOME/.ssh/sync_deploy_key -o IdentitiesOnly=yes' \
            git remote add deploy git@github.com:AcosX/sub2api.git || true

      - name: Tag fork release for new upstream versions
        id: release_tags
        run: |
          set -euo pipefail
          origin_tags=$(git ls-remote --tags origin 'refs/tags/v*' | awk -F 'refs/tags/' '{print $2}' | sed 's/\^{}$//' | sort -u)
          upstream_tags=$(git tag --list 'v*' | grep -v -- '-acosx' | sort -u)
          if [ -z "$upstream_tags" ]; then
            echo "No upstream v* tags found." >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Base versions upstream has already released but fork has not yet built.
          # Only bases strictly newer than the newest fork release base are
          # candidates; with no fork releases yet, take just the newest
          # upstream base so history is not stampeded with rebuilds.
          newest_fork_base=$(printf '%s\n' "$origin_tags" | sed -n 's/^\(v[0-9]*\.[0-9]*\.[0-9]*\)-acosx.*/\1/p' | sort -uV | tail -n 1)
          if [ -z "$newest_fork_base" ]; then
            to_tag=$(printf '%s\n' "$upstream_tags" | sort -uV | tail -n 1)
          else
            to_tag=$(printf '%s\n' "$upstream_tags" | sort -uV | awk -v m="$newest_fork_base" 'f {print} $0==m {f=1}')
          fi

          # Only tag a base if fork main actually contains its release commit, so a
          # just-pushed upstream tag never races ahead of the merge above.
          tag_list=""
          while IFS= read -r base; do
            [ -n "$base" ] || continue
            sha=$(git rev-parse --verify --quiet "refs/tags/$base^{}" || git rev-parse --verify --quiet "refs/tags/$base") || continue
            if git merge-base --is-ancestor "$sha" HEAD; then
              tag_list+="${base}"$'\n'
            else
              echo "$base is not contained in fork main yet; skipping this round." >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$to_tag"

          if [ -z "$tag_list" ]; then
            echo "No new upstream releases to fork-tag." >> "$GITHUB_STEP_SUMMARY"
            echo "pushed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "Fork releases to publish:"
            echo
            printf '%s\n' "$tag_list" | sed 's/^/- `/'
          } >> "$GITHUB_STEP_SUMMARY"

          pushed=0
          while IFS= read -r base; do
            [ -n "$base" ] || continue
            n=$(printf '%s\n' "$origin_tags" | grep -c "^${base}-acosx\." || true)
            fork_tag="${base}-acosx.$((n + 1))"
            git tag -a "$fork_tag" -m "Fork release: upstream ${base} + fork patches (AcosX/sub2api)

            Tracks upstream ${base} with fork-only commits pre-merged (e.g. PR
            Wei-Shaw/sub2api#8608). Later upstream releases supersede this one."
            GIT_SSH_COMMAND="ssh -i $HOME/.ssh/sync_deploy_key -o IdentitiesOnly=yes" \
              git push deploy "refs/tags/$fork_tag:refs/tags/$fork_tag"
            echo "Tagged $fork_tag" >> "$GITHUB_STEP_SUMMARY"
            pushed=$((pushed + 1))
          done <<< "$tag_list"
          echo "pushed=$pushed" >> "$GITHUB_OUTPUT"

